name: spec-driven-longish
version: 1
description: Default OpenSpec workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      BEFORE drafting any proposal content, you MUST run a clarification
      interview to lock down scope. The only way to bypass this rule is for
      the user to explicitly say "skip the interview" in the same turn that
      invokes propose. Inferring "the user probably wants me to skip" from
      context is a violation.

      Interview protocol:
      1. Pause before touching any files in `openspec/changes/<name>/`.
      2. Ask the user clarifying questions. Where a question maps to a small
         set of discrete options, present them as a multiple-choice list so
         the user can pick rather than write open prose. Group related
         questions into a single round of roughly 4 at a time to minimize
         back-and-forth; append genuinely open-ended questions as plain
         prose alongside the multiple-choice block.
      3. The interview MUST cover, at minimum, these four dimensions:
         - **Scope**: what is explicitly in, what is explicitly out.
         - **Capability placement**: which existing capability from
           `openspec/config.yaml`'s capability map owns the new requirements,
           OR justify introducing a new capability.
         - **Acceptance criteria**: what observable behavior or test outcome
           proves the change is complete.
         - **Constraints / non-functionals**: performance budgets, backward
           compatibility, security implications, migration concerns.
         Ask the user whenever you are uncertain about any of these
         dimensions. Treat even low uncertainty (about 5%) as enough reason
         to ask rather than assume. Asking costs a moment; a wrong
         assumption costs an unwound proposal.
      4. After the user answers, proceed with proposal artifact generation.
         If the answers reveal new ambiguity, run as many follow-up rounds
         as needed (there is no cap on rounds) using the same
         multiple-choice-where-possible discipline.

      Why this is mandatory: `propose` generates multiple coupled artifacts
      (proposal.md, design.md, tasks.md, specs/) in one workflow. Drafting
      them on incomplete or assumed requirements produces a proposal that
      looks finished but encodes the wrong scope, lands in the wrong
      capability, or lacks acceptance criteria. Catching this in the
      interview takes minutes; catching it after the fact requires unwinding
      the proposal and any implementation that followed.

      Only AFTER the interview answers are in hand do you draft the proposal
      below.

      ---

      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior (for example, `user-auth`), not the work in this change (for example, `add-login-endpoint`). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.
      - **Scope & Decisions**: Record the locked outcome of the clarification interview: in-scope items, explicitly out-of-scope items, the chosen capability placement with justification, acceptance criteria, and key constraints / non-functionals. This section is REQUIRED; a missing or placeholder section makes the proposal non-conformant.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      run `openspec list --specs` for the project's capability inventory, then
      `openspec show "<spec-id>" --type spec --json --no-scenarios` for any that
      look related - that returns a capability's purpose and requirement texts
      without pulling whole spec files into context. Append `--store "<id>"` to
      both commands only for a registered standalone store, and keep `--type
      spec`: a change and a spec sharing a name is otherwise an ambiguous-item
      error. `openspec list` without `--specs` lists in-flight changes, not
      specs - it never shows what the project already covers. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      The filtered read is only an overview. Before deciding what is already
      covered or what should change, read each relevant spec in full, including
      scenarios, with `openspec show "<spec-id>" --type spec` (same `--store` rule).
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, compare the capabilities the proposal lists
        with the `specs/<capability-path>/spec.md` files that already exist,
        and start with the first capability that has no file. Do not rewrite
        an existing file unless the user asks you to.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it. Do not plan every file
        before writing the first.
      - Stop when every capability the proposal lists has its file.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - Keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` flags longer descriptions in ADDED requirements and in the main spec. This is a warning: normal validation still passes, but `openspec validate --strict` fails on it. When writing a new requirement, state one behavior per requirement: move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios. Under MODIFIED, keep the existing requirement block whole; never split, trim or rewrite existing text just to meet the length. Split an existing long requirement only when the user asks for it, in a change made for that purpose: under MODIFIED, keep its header and every scenario and cut its description down to one behavior without changing its meaning, then add each behavior you removed as its own ADDED requirement with its own scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Correcting a SCENARIO TITLE (no delta operation exists for this):
      The delta grammar cannot express a scenario retitle. Validate and archive
      share a check requiring a MODIFIED block to carry every scenario title the
      canonical requirement currently has; there is no scenario-level RENAMED
      form; a requirement-rename-plus-modify pair is refused; and a same-title
      REMOVED plus ADDED pair is refused. A stale title therefore has to be
      corrected by editing the canonical spec directly, under ALL of:
      1. Title text only. Every scenario body stays byte-identical and the
         requirement's scenario count is unchanged.
      2. The change's design.md records each retitle as a FROM/TO pair with the
         reason the old title is false.
      3. Any delta in the same change carrying that requirement is retitled in
         the SAME edit, so validate and archive see consistent titles throughout.
      A body correction never rides along; it goes through an ordinary MODIFIED
      delta authored against the corrected titles.

      The spec-loss guard needs no exemption for this and must not be given one:
      it is deliberately blind to wording, and a title-only, count-preserving
      retitle is wording. It stays the backstop proving no scenario was dropped
      alongside the retitle.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      design.md is always produced. It is a hard dependency of tasks, so
      every change generates it; size it to the change (a few lines per
      section is fine for a small one). Give the Decisions and Risks
      sections extra weight when any of these apply:
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below for tracked tasks.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all.

      Guidelines:
      - Group related tracked tasks under ## numbered headings
      - Each tracked task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Track implementation and verification work that can be completed before
        archive. If the requested workflow includes archive or work that requires
        this change to be archived, preserve those steps as plain bullets in an
        optional `## Workflow follow-up` section at the end of tasks.md. These
        bullets are reference information outside tracked task progress.
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Each task group MUST land the tests and documentation its own work
        calls for. Do NOT collect testing or documentation into a final group -
        when a late group first exercises work from an early one, the failures
        cascade back through every group in between and force rework. A group
        whose work calls for neither, such as scaffolding or dependency setup,
        carries neither. A final group is for integration checks only, not for
        the tests and docs an earlier group owed.

      Example:
      ```
      # Tasks

      ## 1. Setup

      - [ ] 1.1 Create new module structure and verify expected files are present
      - [ ] 1.2 Add dependencies to package.json and verify package installation succeeds

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function and verify the export test passes
      - [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters
      - [ ] 2.3 Document the export API in docs/export.md and verify the documented command runs as written
      ```

      When applicable, append workflow follow-up as plain bullets, for example:
      ```
      ## Workflow follow-up

      - Archive the change after the project's review requirements are satisfied.
      - Verify the archived result.
      ```

      Reference specs for what needs to be built, design for how to build it.

      ---

      Rules for verification that needs the merged state.

      A change is archived inside its own merge request before that
      merge request merges, so `tasks.md` MUST NOT contain a task that
      can only run after the merge. A task is post-merge when it
      depends on the merged state: a pipeline on the target branch,
      configuration read from the default branch, or a merge request
      after this one.

      Write such verification as a pre-merge task instead, worded like:
        "Add the post-merge checks to the merge request description
         under `### Post-merge checks`: `- [ ] <first check>`,
         `- [ ] <second check>`."
      The task carries the checks verbatim, so the archived `tasks.md`
      still records what is to be verified, and it is ticked before
      archive. When several changes in one merge request contribute
      checks, they share the one `### Post-merge checks` section and
      each item names its change.

      Once a check runs, its evidence (job link, log line, measured
      values) is posted as a comment on the merged merge request and
      its `- [ ]` item in the description is ticked.

      ---

      Render the freshly-generated task list as a markdown table once
      the tasks file is written. This gives the user an at-a-glance
      view of everything the apply phase will work through. Mandatory;
      do NOT skip. The commit-message suggestion for the propose pass
      is emitted later, by the `summary` artifact's instruction.
      Steps:

      1. Fetch the full task list:
         `openspec instructions apply --change "<name>" --json`
         Parse the `tasks` array. Each entry has `id` (integer),
         `description` (string starting with the task number like `1.1`,
         `2.3`), and `done` (boolean).

      2. Render exactly this table:

         | Phase | # | Task | Status |
         |---|---|---|---|
         | 1 | 1.1 | <one-line summary, leading `1.1 ` stripped> | `[ ]` |
         | 1 | 1.2 | <…> | `[ ]` |
         | 2 | 2.1 | <…> | `[ ]` |
         | … | … | … | … |

      3. Rules for the table:
         - **Phase** column comes from the leading `N` in the `N.M` task
           number.
         - **#** column is the full `N.M` identifier.
         - **Task** column is the description with the leading `N.M `
           stripped, collapsed to a single line, capped at ~120 chars
           (truncate with `…` only when necessary).
         - **Status** column is `[ ]` for `done: false` and `[x]` for
           `done: true`. At propose time every row is `[ ]`.
         - Render every row — do not omit, do not collapse phases into
           subheadings, do not insert horizontal separators between
           phases.
    requires:
      - specs
      - design

  - id: summary
    generates: summary.md
    description: Plain-language summary for non-technical stakeholders (Product Owners, managers)
    template: summary.md
    instruction: |
      Create a plain-language summary aimed at non-technical readers
      (Product Owners, project managers, and other business
      stakeholders). The goal is for someone outside engineering to
      read this in under a minute and walk away knowing: what problem
      we are solving, what we are shipping, what the business benefit
      is, and what could go wrong or slip.

      Required sections (use exactly these headings, in this order):

      - **Problem**: The business pain in plain language. Size this
        section to the change — no length cap.
      - **Solution**: What we will ship, described in terms a user or
        business stakeholder would recognize. Avoid implementation
        detail.
      - **Business Outcome**: The concrete benefit. Include a metric
        if one exists; otherwise describe the observable improvement.
      - **Risks & Timing**: Plain-language risks and a rough effort
        framing (e.g. "small", "medium", "needs migration window").
        May be omitted only when the change has neither risks nor
        timing constraints worth flagging.

      The four sections above are the ENTIRE body of `summary.md`.
      Do NOT append additional sections, horizontal rules, footers,
      "Suggested commit message" blocks, or any other content after
      the Risks & Timing section. The file ends where Risks & Timing
      ends. The commit-message suggestion described later in this
      instruction is a chat-level deliverable, NOT a file section —
      see the explicit boundary below.

      Tone: soft guidance. Write for Product Owners and Managers.
      Focus on business outcome, not implementation. There is no hard
      list of forbidden terms and no word or page cap; trust your
      judgement and keep it short.

      Source material: read `proposal.md` for motivation,
      `design.md` for risks and migration framing, and `tasks.md` for
      effort framing. Do NOT copy sections verbatim — translate the
      technical material into business language.

      ---

      After this artifact is written, the propose workflow is
      complete: `summary` is the last artifact in the dependency
      chain (`proposal`, `design`, and `tasks` are all prerequisites),
      so reaching this point means every propose-phase file has been
      generated.

      End the propose workflow by suggesting ONE git commit message
      for the entire change set just generated (typically: the new
      `openspec/changes/<name>/` directory including the just-written
      `summary.md`).

      File boundary (MUST NOT violate): the commit-message suggestion
      is a CHAT-LEVEL deliverable surfaced in your reply to the user
      AFTER the file is written. It MUST NOT be embedded inside
      `summary.md` (or any other artifact file in the change
      directory) — no "Suggested commit message" section, no
      trailing code block, no horizontal rule + footer. The summary
      file is a stakeholder-facing artifact that lives forever in
      the change directory and is later archived; a commit message
      is a one-time conversational suggestion for the engineer
      running propose. Mixing the two pollutes the artifact and
      freezes a transient suggestion into permanent spec history.

      Do NOT run `git commit` yourself; the suggestion is text the
      user can copy, amend, or discard. Follow the project's
      commit-message conventions when they are documented in
      `CLAUDE.md`, a `.gitmessage` template, or a project commit
      policy. When no convention is documented, default to a single
      short imperative title under 72 characters, no body, no
      trailers. Example: "Propose <change-name>".
    requires:
      - proposal
      - design
      - tasks

apply:
  requires: [tasks, summary]
  tracks: tasks.md
  instruction: |
    Render the task list as a markdown table at session start AND again
    at completion/pause. Mandatory; do NOT skip. The same table format
    applies to both renders — only the `Status` column changes as work
    progresses.

    Steps for each render:

    1. Fetch the task list (re-fetch at completion/pause to capture
       freshly-flipped `done` flags):
       `openspec instructions apply --change "<name>" --json`
       Parse the `tasks` array. Each entry has `id` (integer),
       `description` (string starting with `N.M `), and `done` (boolean).

    2. Render exactly this table:

       | Phase | # | Task | Status |
       |---|---|---|---|
       | 1 | 1.1 | <one-line summary, leading `1.1 ` stripped> | `[ ]` or `[x]` |
       | 1 | 1.2 | <…> | `[ ]` or `[x]` |
       | 2 | 2.1 | <…> | `[ ]` or `[x]` |
       | … | … | … | … |

    3. Rules for the table:
       - **Phase** column comes from the leading `N` in the `N.M` task
         number.
       - **#** column is the full `N.M` identifier.
       - **Task** column is the description with the leading `N.M `
         stripped, collapsed to a single line, capped at ~120 chars
         (truncate with `…` only when necessary).
       - **Status** column is `[x]` when `done: true`, `[ ]` otherwise.
       - Render every row — do not omit, do not collapse phases into
         subheadings, do not insert horizontal separators between
         phases.

    At session start, the table is the headline of the "show current
    progress" output. At completion/pause, the table replaces the
    bulleted progress summary — readers should see exactly which rows
    flipped from `[ ]` to `[x]` this session compared to whatever
    started the session.

    ---

    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.

    Before declaring work complete, run these last-mile sync checks. They
    cover routine maintenance steps that are easy to forget and that
    `openspec archive` does NOT perform automatically:

    - **Capability map**: If this change creates a new capability spec at
      `openspec/specs/<name>/spec.md` (typically because the proposal
      listed it under "New Capabilities"), confirm that the same
      kebab-case name appears as an entry in `openspec/config.yaml`'s
      capability map, grouped under the appropriate area heading
      (Academic, Platform, etc.). The map is the discovery surface for
      the spec; an unregistered capability hides from contributors and
      agents who orient themselves by reading `config.yaml` first. If
      missing, add the entry now with a one-line description matching
      the format of sibling entries.

    - **CLAUDE.md capability-spec table** (if the project uses
      Progressive Disclosure): if a new capability spec was created OR
      an existing one gained a normative requirement that belongs in
      the project's headline rules table, add or update the
      corresponding row in `CLAUDE.md`'s capability-spec table. Keep
      the summary self-contained per the rule file in
      `.claude/rules/openspec.md`.

    - **Archive before merge**: confirm no task in `tasks.md` is
      post-merge (one that depends on a pipeline on the target branch,
      configuration read from the default branch, or a merge request
      after this one). If one is, replace it with a pre-merge task that
      moves it into the merge request description's
      `### Post-merge checks` checklist, and tick that task once the
      description carries it. The change is archived inside its own
      merge request before that merge request merges; the archive is
      never left for after the merge.

    When ALL tasks are checked off, end the apply session with a
    "## What shipped" section that lists, in this order, only the
    categories with non-empty content for this change:

    - **New HTTP endpoints**: method + path, one per line (e.g. `POST /api/v1/course-equivalencies`).
    - **New / changed database tables**: table name + one-line summary of the migration intent.
    - **New artisan commands**: command signature (e.g. `php artisan courses:import-legacy`).
    - **New permissions / config keys**: full key string (e.g. `courses:view:history`, `services.gemini.project_id`).
    - **Removed code**: deleted files or significant excisions, one line each.
    - **Follow-ups**: anything intentionally deferred to a separate proposal.

    Keep each bullet to one line. This is a quick-reference summary, not a
    re-explanation of the change. Skip any category that has nothing to
    report (do NOT emit empty headings).

    After the "What shipped" summary, if there are uncommitted changes in
    the working tree from this apply session, suggest ONE git commit
    message that covers them. Do NOT run `git commit` yourself; the
    suggestion is text the user can copy, amend, or discard. Follow the
    project's commit-message conventions when documented in `CLAUDE.md`,
    a `.gitmessage` template, or a project commit policy. When no
    convention is documented, default to a single short imperative title
    under 72 characters, no body, no trailers. Example: "Implement
    <change-name>". If the user has already committed incrementally
    during apply (working tree is clean), skip this step.
